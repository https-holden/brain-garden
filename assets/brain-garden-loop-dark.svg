<text x="448" y="320" font-size="12" font-weight="700" letter-spacing="1.5" fill="#93C487">SHORT-TERM</text>
<text x="448" y="346" font-size="17" font-weight="700" fill="#ECF0E6">Today's daily note</text>
<text x="448" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#B3BEAD">Daily/</text>
