<path d="M -6 -10 L 6 0 L -6 10" transform="translate(47.5 440) rotate(-90)"/>
</g>
<rect x="350" y="215" width="300" height="460" rx="26" fill="#1C261D" stroke="#2A3A2A" stroke-width="10"/>
<rect x="350" y="215" width="300" height="460" rx="26" fill="none" stroke="#4F7048" stroke-width="7" stroke-linecap="round" stroke-dasharray="0.1 11"/>
<text x="502" y="250" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="3" fill="#93C487">YOUR VAULT</text>
<text x="500" y="272" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14.5" fill="#B3BEAD">a garden you can walk around in</text>
<rect x="368" y="290" width="264" height="110" rx="14" fill="#222E23" stroke="#34452F" stroke-width="1.5"/>
<g transform="translate(406 345)" fill="none" stroke="#93C487" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
