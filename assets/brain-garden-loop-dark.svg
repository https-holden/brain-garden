</g>
<text x="92" y="800" font-size="16" font-weight="700" fill="#ECF0E6">Private beds</text>
<text x="92" y="822" font-size="14" fill="#B3BEAD">yours alone, by default</text>
<g transform="translate(350 806)" fill="none" stroke="#93C487" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
<circle cx="-6" cy="-5" r="4.5" fill="#2C3D2B"/>
<path d="M -15 11 C -15 2 3 2 3 11" fill="#2C3D2B"/>
<circle cx="7" cy="-3" r="4.5" fill="#2C3D2B"/>
<path d="M -2 13 C -2 4 16 4 16 13" fill="#2C3D2B"/>
</g>
<text x="382" y="800" font-size="16" font-weight="700" fill="#ECF0E6">Shared beds</text>
<text x="382" y="822" font-size="14" fill="#B3BEAD">optional: open a gate to others</text>
<g transform="translate(660 806)" fill="none" stroke="#D49A64" stroke-linecap="round">
<path d="M -18 11 C -9 11 -8 0 0 0" stroke-width="5"/>
<path d="M 0 0 C 8 0 8 -11 18 -11" stroke-width="2.4" stroke-dasharray="0.1 5"/>
