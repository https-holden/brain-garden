<path d="M -16 -2 L 16 -2 L 12 14 L -12 14 Z" fill="#3D3220"/>
<path d="M -14 5 L 14 5"/>
</g>
<text font-size="15.5" fill="#B3BEAD"><tspan x="24" y="84">Gather it from where it</tspan><tspan x="24" y="106">already lives: notes apps,</tspan><tspan x="24" y="128">voice memos, articles, PDFs,</tspan><tspan x="24" y="150">email, old journals</tspan></text>
</g></g>
<g class="bg-step bg-s2"><g transform="translate(680 160)">
<rect width="280" height="170" rx="18" fill="#1F2620" stroke="#5E4A3A" stroke-width="1.5" filter="url(#bg-soft-d)"/>
<circle cx="34" cy="38" r="15" fill="#D3A27C"/>
<text x="34" y="43.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2620">2</text>
<text x="60" y="45" font-size="20" font-weight="800" letter-spacing="2" fill="#D3A27C">SEED</text>
<g transform="translate(246 38)" fill="none" stroke="#D3A27C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
<path d="M -17 14 C -8 7 8 7 17 14"/>
<path d="M 0 9 L 0 -4"/>
<rect x="-10" y="-17" width="20" height="13" rx="2.5" fill="#3D3128"/>
<path d="M -5 -12.5 L 5 -12.5 M -5 -8.5 L 2 -8.5"/>
</g>
<text font-size="15.5" fill="#B3BEAD"><tspan x="24" y="84">Plant it back in the vault</tspan><tspan x="24" y="106">so it means something:</tspan><tspan x="24" y="128">filed, named, linked and</tspan><tspan x="24" y="150">tagged by topic</tspan></text>
</g></g>
<g class="bg-step bg-s3"><g transform="translate(680 550)">
<rect width="280" height="170" rx="18" fill="#1F2620" stroke="#3D5A40" stroke-width="1.5" filter="url(#bg-soft-d)"/>
<circle cx="34" cy="38" r="15" fill="#8CCB98"/>
<text x="34" y="43.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2620">3</text>
<text x="60" y="45" font-size="20" font-weight="800" letter-spacing="2" fill="#8CCB98">LIVE IN IT</text>
<g transform="translate(246 38)" fill="none" stroke="#8CCB98" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
<path d="M -18 15 L 18 15"/>
<path d="M -13 15 L -13 -2 A 13 13 0 0 1 13 -2 L 13 15"/>
<path d="M -8 15 L -8 -2 A 8 8 0 0 1 8 -2 L 8 15"/>
<circle cx="-9" cy="-12" r="3" fill="#3A5636"/>
<circle cx="10" cy="-9" r="3" fill="#3A5636"/>
</g>
<text font-size="15.5" fill="#B3BEAD"><tspan x="24" y="84">Use it every day. Tidy,</tspan><tspan x="24" y="106">linked notes let AI find</tspan><tspan x="24" y="128">its way to your answers</tspan><tspan x="24" y="150">fastest</tspan></text>
</g></g>
<g class="bg-step bg-s4"><g transform="translate(40 550)">
<rect width="280" height="170" rx="18" fill="#1F2620" stroke="#3A5A5E" stroke-width="1.5" filter="url(#bg-soft-d)"/>
<circle cx="34" cy="38" r="15" fill="#85C3CC"/>
<text x="34" y="43.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2620">4</text>
<text x="60" y="45" font-size="20" font-weight="800" letter-spacing="2" fill="#85C3CC">LEARN</text>
<g transform="translate(246 38)" fill="none" stroke="#85C3CC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
<path d="M 6.5 -11.26 A 13 13 0 1 1 -6.5 -11.26"/>
<path d="M -12.3 -12.8 L -6.5 -11.26 L -8.05 -5.46"/>
<path d="M 0 6 C -6 2 -5 -4 0 -6 C 5 -4 6 2 0 6 Z" fill="#2D4A4E"/>
</g>
<text font-size="15.5" fill="#B3BEAD"><tspan x="24" y="84">The garden improves its own</tspan><tspan x="24" y="106">process as you use it: most</tspan><tspan x="24" y="128">in the early days, less once</tspan><tspan x="24" y="150">it settles</tspan></text>
</g></g>
<path d="M 40 760 L 960 760" stroke="#2E352C" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 6"/>
