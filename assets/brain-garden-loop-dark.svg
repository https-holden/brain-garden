<text x="448" y="564" font-size="12" font-weight="700" letter-spacing="1.5" fill="#93C487">LONG-TERM</text>
<text x="448" y="590" font-size="17" font-weight="700" fill="#ECF0E6">Notes, References,</text>
<text x="448" y="612" font-size="17" font-weight="700" fill="#ECF0E6">People, Clippings</text>
<text x="448" y="636" font-size="13" fill="#B3BEAD">Work: Knowledge, Playbooks</text>
<g class="bg-step bg-s1"><g transform="translate(40 160)">
<rect width="280" height="170" rx="18" fill="#1F2620" stroke="#6B5530" stroke-width="1.5" filter="url(#bg-soft-d)"/>
<circle cx="34" cy="38" r="15" fill="#E2AD5B"/>
<text x="34" y="43.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2620">1</text>
<text x="60" y="45" font-size="20" font-weight="800" letter-spacing="2" fill="#E2AD5B">HARVEST</text>
<g transform="translate(246 38)" fill="none" stroke="#E2AD5B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
<circle cx="-5" cy="-5" r="4.5" fill="#5A4520"/>
<circle cx="5" cy="-6" r="4" fill="#5A4520"/>
