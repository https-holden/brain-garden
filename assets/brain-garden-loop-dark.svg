<text x="692" y="800" font-size="16" font-weight="700" fill="#ECF0E6">Desire paths</text>
<text font-size="14" fill="#B3BEAD"><tspan x="692" y="822">busy routes get paved,</tspan><tspan x="692" y="842">lost turns get signposts</tspan></text>
