<path d="M -15 20 L 15 20"/>
<path d="M 0 20 L 0 2"/>
<path d="M 0 10 L -6 4 M 0 7 L 6 1"/>
<path d="M -14 -4 C -18 -12 -12 -20 -5 -19 C -2 -25 8 -24 10 -18 C 17 -17 18 -7 13 -3 C 11 3 3 4 0 1 C -4 4 -12 3 -14 -4 Z" fill="#3A5636"/>
