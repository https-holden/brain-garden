<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="870" viewBox="0 0 1000 870" role="img" aria-label="Brain Garden: harvest it, seed it, live in it, learn. A loop around your vault, where today's note, Now.md and long-term notes grow like a garden.">
<defs>
<filter id="bg-soft-d" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/></filter>
</defs>
<style>
@keyframes bg-flow{to{stroke-dashoffset:-34.2}}
@keyframes bg-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.bg-stones{animation:bg-flow 3.2s linear infinite}
.bg-step{animation:bg-rise .8s cubic-bezier(.2,.7,.3,1) both}
.bg-s1{animation-delay:.1s}.bg-s2{animation-delay:.35s}.bg-s3{animation-delay:.6s}.bg-s4{animation-delay:.85s}
@media (prefers-reduced-motion:reduce){.bg-stones,.bg-step{animation:none}}
</style>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
